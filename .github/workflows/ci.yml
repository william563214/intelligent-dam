# CI: cargo test/clippy + frontend typecheck/vitest on Linux, Windows, and macOS
# Does not create tags or releases
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libgtk-3-dev \
            ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      - name: Setup Rust toolchain
        # Action pinned to stable-branch tip toolchain pinned to MSRV
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.83.0"
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Cargo test (lib + integration)
        working-directory: src-tauri
        # Windows: build.rs uses rustc-link-arg-tests (not the app link line) to
        # add Common-Controls v6 for tests/ only — see tauri-apps/tauri#13419.
        # test-support: Jobs persistence helpers (not linked in release builds).
        run: cargo test --locked --features test-support

      - name: Cargo clippy (test-support)
        working-directory: src-tauri
        run: cargo clippy --locked --features test-support -- -D warnings

      # Matches tauri build / release-windows (no test-support); catches dead_code
      # and cfg-gated paths that feature-enabled clippy never sees.
      - name: Cargo clippy (release config)
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

  # #63: compile/test macOS-only NFC path normalize without changing ubuntu/windows jobs
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.83.0"
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Cargo test (lib + integration)
        working-directory: src-tauri
        run: cargo test --locked --features test-support

      - name: Cargo clippy (test-support)
        working-directory: src-tauri
        run: cargo clippy --locked --features test-support -- -D warnings

      - name: Cargo clippy (release config)
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings
