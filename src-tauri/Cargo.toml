[package]
name = "intelligent-dam"
version = "0.1.0"
description = "Intelligent Digital Asset Management System"
authors = ["liaoweizhe"]
edition = "2021"
# 依賴樹最高 rust-version 來自 pest / icu_*（1.83）；rfd 關閉預設特徵後不再拉取 edition 2024 的 wayland-protocols
rust-version = "1.83"

[lib]
name = "intelligent_dam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 與目前 Cargo.lock 對齊 使用 ~ 釘住相容範圍 避免 minor 漂移
tauri-build = { version = "~2.5.2", features = [] }

[dependencies]
tauri = { version = "~2.9.3", features = ["protocol-asset"] }
tauri-plugin-opener = "~2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json"] }
notify = "6.1"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
image = "0.24"
regex = "1.10"
handlebars = "5"
tauri-plugin-dialog = "~2.6.0"

# Linux 禁用 rfd gtk3 後備 以免在 tao setup MainContext 下 GtkGlobalThread 死鎖
# macOS / Windows 使用原生 rfd 對話框 無需 xdg-portal/gtk3 預設特徵
# common-controls-v6 由 tauri-plugin-dialog 提供
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "~0.16.0", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
