[package]
name = "intelligent-dam"
version = "0.1.0"
description = "Intelligent Digital Asset Management System"
authors = ["liaoweizhe"]
edition = "2021"
# 依賴樹最高 rust-version 來自 pest / icu_*（1.83）；rfd 關閉預設特徵後不再拉取 edition 2024 的 wayland-protocols
rust-version = "1.83"

[lib]
name = "intelligent_dam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Test-only helpers (drain_for_test, arm_fault, test_support re-exports). Not for release.
test-support = []

[build-dependencies]
# 與目前 Cargo.lock 對齊 使用 ~ 釘住相容範圍 避免 minor 漂移
tauri-build = { version = "~2.5.2", features = [] }

[dependencies]
tauri = { version = "~2.9.3", features = ["protocol-asset"] }
tauri-plugin-opener = "~2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json"] }
notify = "6.1"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
image = "0.24"
regex = "1.10"
handlebars = "5"
same-file = "1"
unicode-segmentation = "1.12"
tauri-plugin-dialog = "~2.6.0"

# Linux 禁用 rfd gtk3 後備 以免在 tao setup MainContext 下 GtkGlobalThread 死鎖
# macOS / Windows 使用原生 rfd 對話框 無需 xdg-portal/gtk3 預設特徵
# common-controls-v6 由 tauri-plugin-dialog 提供
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "~0.16.0", default-features = false }

# Stable volume serial + file index (std::os::windows::fs::MetadataExt is unstable)
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

# #63: NFC only on macOS (APFS/HFS+ often expose NFD). Linux/Windows keep on-disk bytes.
[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Same as lib dep so watcher_e2e can hold an exclusive lock during pause/resume
fs4 = { version = "1.1", default-features = false, features = ["sync"] }

# Integration tests import `test_support`; skip them unless the feature is on
# so plain `cargo test` / release clippy do not fail to compile.
[[test]]
name = "jobs_persistence"
path = "tests/jobs_persistence.rs"
required-features = ["test-support"]

[[test]]
name = "commands_integration"
path = "tests/commands_integration.rs"
required-features = ["test-support"]

[[test]]
name = "watcher_e2e"
path = "tests/watcher_e2e.rs"
required-features = ["test-support"]

# Cross-process writer for paused_then_resumed watcher_e2e (#93)
[[bin]]
name = "idam_pause_writer"
path = "tests/bin/pause_writer.rs"
required-features = ["test-support"]
